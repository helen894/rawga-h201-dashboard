<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>priority.js 테스트</title>
<style>
  body { font-family: monospace; padding: 16px; }
  .pass { color: #0a7d32; } .fail { color: #c0212f; font-weight: bold; }
  #summary { font-size: 1.2em; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="summary">running…</div>
<ul id="results"></ul>
<script src="priority.js"></script>
<script>
const P = window.PriorityEngine;
const out = [];
function eq(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  out.push({ name, ok, actual: JSON.stringify(actual), expected: JSON.stringify(expected) });
}

// 고정 시각: UTC 2026-07-06 16:00 = KST 2026-07-07(화) 01:00 — UTC/KST 날짜가 갈리는 시각
const NOW = new Date('2026-07-06T16:00:00Z');
const RULES = {
  weights: { deadline: 0.40, requester: 0.25, axis: 0.20, load: 0.15 },
  axis_multiplier: { rawga: 1.0, h201: 1.3 },
  requester_tiers: {
    "대표": { boost: 40, members: ["김대표", "나대표"] },
    "핵심": { boost: 20, members: ["이핵심", "박핵심"] },
    "일반": { boost: 0, members: [] }
  },
  overdue_bonus: 50, due_today_bonus: 30, due_this_week_bonus: 15, no_assignee_penalty: 20
};

// ── 1. KST 날짜 판정 (오늘=화요일 2026-07-07, 이번주 일요일=07-12) ──
eq('KST 오늘 판정(UTC는 아직 7/6)', P.scoreAll({}, RULES, { now: NOW }).todayStr, '2026-07-07');
eq('dueBucket: 어제=overdue', P.dueBucket('2026-07-06', '2026-07-07'), 'overdue');
eq('dueBucket: 오늘', P.dueBucket('2026-07-07', '2026-07-07'), 'today');
eq('dueBucket: 이번주(일요일 07-12까지)', P.dueBucket('2026-07-12', '2026-07-07'), 'this_week');
eq('dueBucket: 차주 월요일=later', P.dueBucket('2026-07-13', '2026-07-07'), 'later');
eq('dueBucket: 마감없음=none', P.dueBucket(null, '2026-07-07'), 'none');
eq('일요일이 오늘이면 this_week 없음', P.dueBucket('2026-07-13', '2026-07-12'), 'later');

// ── 2. 등급 조회 ──
eq('김대표=대표', P.lookupTier('김대표', RULES), '대표');
eq('이핵심=핵심', P.lookupTier('이핵심', RULES), '핵심');
eq('미등록=일반', P.lookupTier('아무개', RULES), '일반');
eq('null=일반', P.lookupTier(null, RULES), '일반');
eq('공백 트림', P.lookupTier(' 나대표 ', RULES), '대표');

// ── 3. 점수 계산 (기본 가중치 = 액면가) ──
const data = {
  tasks: [
    // 지연 + 대표 요청 + 담당자(부하1) → (50+40)*1.0 + 1 = 91
    { task_id: 't1', name: '지연+대표', assignee: '김담당', requester: '김대표', due_date: '2026-07-06', status: 'active', permalink_url: 'u1' },
    // 오늘 + 일반 → 30*1.0 + 담당자없음 20 = 50
    { task_id: 't2', name: '오늘+무담당', assignee: null, requester: '아무개', due_date: '2026-07-07', status: 'active', permalink_url: 'u2' },
    // 완료 → 제외
    { task_id: 't3', name: '완료된 것', assignee: '김담당', requester: null, due_date: '2026-07-06', status: 'completed', permalink_url: 'u3' }
  ],
  listItems: [
    // H201 오늘 + 무담당 → 30*1.3 + 20 = 59
    { list_item_id: 'r1', title: 'H201 오늘', assignee: null, due_date: '2026-07-07', status: '진행중', channel_id: 'C1', permalink: 'p1' },
    // 완료 라벨 → 제외
    { list_item_id: 'r2', title: '완료건', assignee: null, due_date: null, status: 'Done', channel_id: 'C1', permalink: 'p2' }
  ],
  mentions: [
    // 나대표(대표) 멘션 → 40*0.25/0.25=40, ×1.3 = 52 (멘션은 담당자없음 페널티 제외)
    { message_ts: '111.1', channel_id: 'C2', text: '@담당자 확인 부탁', author: '나대표', thread_ts: null, permalink: 'm1' }
  ]
};
const res = P.scoreAll(data, RULES, { now: NOW });
eq('완료 항목 제외 후 개수', res.items.length, 4);
eq('정렬 순서(점수 내림차순)', res.items.map(i => i.key),
   ['task:t1', 'list:r1', 'mention:111.1', 'task:t2']);
eq('t1 점수 = (50+40)×1.0+부하1', res.items[0].score, 91);
eq('r1 점수 = 30×1.3+20', res.items.find(i => i.key === 'list:r1').score, 59);
eq('멘션 점수 = 40×1.3 (페널티 없음)', res.items.find(i => i.key === 'mention:111.1').score, 52);
eq('t2 점수 = 30+20', res.items.find(i => i.key === 'task:t2').score, 50);
eq('부하 집계(완료 제외)', res.loadByAssignee['김담당'], 1);
eq('t1 근거 문구', res.items[0].reasons, ['지연 D+1', '대표 요청 (김대표)', '담당자 부하 1건']);

// ── 4. 가중치 슬라이더 동작 (상대 배율) ──
const RULES2 = JSON.parse(JSON.stringify(RULES));
RULES2.weights.deadline = 0.80; // 마감 영향 2배
const res2 = P.scoreAll(data, RULES2, { now: NOW });
eq('deadline 가중 2배 → t1 = (100+40)+1', res2.items.find(i => i.key === 'task:t1').score, 141);
RULES2.weights.deadline = 0.40; RULES2.weights.axis = 0; // 축 효과 제거
const res3 = P.scoreAll(data, RULES2, { now: NOW });
eq('axis 가중 0 → r1 = 30+20 (배수 무효)', res3.items.find(i => i.key === 'list:r1').score, 50);

// ── 5. includeClosed 옵션 ──
eq('includeClosed=true 개수', P.scoreAll(data, RULES, { now: NOW, includeClosed: true }).items.length, 6);

// ── 렌더 ──
const ul = document.getElementById('results');
let passCount = 0;
for (const r of out) {
  const li = document.createElement('li');
  li.className = r.ok ? 'pass' : 'fail';
  li.textContent = (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.ok ? '' : ` — got ${r.actual}, want ${r.expected}`);
  ul.appendChild(li);
  if (r.ok) passCount++;
}
const summary = `${passCount}/${out.length} PASS` + (passCount === out.length ? ' ✅' : ' ❌');
document.getElementById('summary').textContent = summary;
document.title = summary;
</script>
</body>
</html>
